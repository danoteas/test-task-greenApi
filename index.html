<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GREEN-API Client</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --border: #e2e5ea;
    --text: #1a1d23;
    --muted: #6b7280;
    --accent: #25d366;
    --accent-dark: #1da851;
    --radius: 8px;
    --shadow: 0 1px 4px rgba(0,0,0,0.08);
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 16px;
  }

  header {
    max-width: 960px;
    margin: 0 auto 32px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 36px;
    height: 36px;
    background: var(--accent);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo svg { width: 20px; height: 20px; fill: white; }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  header span {
    font-size: 13px;
    color: var(--muted);
    margin-left: 4px;
    font-weight: 400;
  }

  .layout {
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 20px;
    align-items: start;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .panel-section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .panel-section:last-child { border-bottom: none; }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 12px;
  }

  input, textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.15s;
    font-family: inherit;
  }

  input:focus, textarea:focus {
    border-color: var(--accent);
    background: #fff;
  }

  input + input { margin-top: 8px; }

  textarea {
    resize: vertical;
    min-height: 72px;
    margin-top: 8px;
  }

  .field + .field { margin-top: 8px; }

  button {
    width: 100%;
    padding: 9px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
    text-align: center;
  }

  button:hover {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  button:active { opacity: 0.85; }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--accent-dark);
    border-color: var(--accent-dark);
  }

  .response-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    position: sticky;
    top: 32px;
  }

  .response-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .response-header h2 {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .status-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
    background: #f3f4f6;
    color: var(--muted);
  }

  .status-badge.ok { background: #dcfce7; color: #166534; }
  .status-badge.err { background: #fee2e2; color: #991b1b; }
  .status-badge.loading { background: #fef9c3; color: #854d0e; }

  .response-meta {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    font-family: 'SF Mono', 'Fira Code', monospace;
    min-height: 36px;
  }

  #response-output {
    display: block;
    width: 100%;
    min-height: 420px;
    padding: 16px 20px;
    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    font-size: 12px;
    line-height: 1.7;
    color: var(--text);
    background: #fafafa;
    border: none;
    resize: vertical;
    outline: none;
  }

  .spinner {
    display: none;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-left: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
  .loading .spinner { display: inline-block; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
    </svg>
  </div>
  <h1>GREEN-API Client <span>WhatsApp API</span></h1>
</header>

<div class="layout">

  <div>

    <div class="panel" style="margin-bottom:16px">
      <div class="panel-section">
        <div class="section-label">Подключение</div>
        <input type="text" id="idInstance" placeholder="idInstance" autocomplete="off">
        <input type="text" id="apiToken" placeholder="ApiTokenInstance" autocomplete="off">
      </div>
    </div>

    <div class="panel" style="margin-bottom:16px">
      <div class="panel-section">
        <div class="section-label">Аккаунт</div>
        <button onclick="callMethod('getSettings')">getSettings</button>
      </div>
      <div class="panel-section">
        <button onclick="callMethod('getStateInstance')">getStateInstance</button>
      </div>
    </div>

    <div class="panel" style="margin-bottom:16px">
      <div class="panel-section">
        <div class="section-label">Отправить сообщение</div>
        <input type="text" id="msg-phone" placeholder="7777234567" autocomplete="off">
        <textarea id="msg-text" placeholder="Hello World!"></textarea>
        <button class="btn-primary" style="margin-top:10px" onclick="callMethod('sendMessage')">sendMessage</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-section">
        <div class="section-label">Отправить файл по URL</div>
        <input type="text" id="file-phone" placeholder="7777234567" autocomplete="off">
        <input type="text" id="file-url" placeholder="https://my.site.com/img/horse.png" autocomplete="off">
        <button class="btn-primary" style="margin-top:10px" onclick="callMethod('sendFileByUrl')">sendFileByUrl</button>
      </div>
    </div>

  </div>

  <div class="response-panel">
    <div class="response-header">
      <h2>Ответ <span class="spinner" id="spinner"></span></h2>
      <span class="status-badge" id="status-badge">—</span>
    </div>
    <div class="response-meta" id="response-meta"></div>
    <textarea id="response-output" readonly placeholder="Ответ API появится здесь..."></textarea>
  </div>

</div>

<script>
  const BASE = 'https://7201.api.green-api.com';

  function getCredentials() {
    const id = document.getElementById('idInstance').value.trim();
    const token = document.getElementById('apiToken').value.trim();
    if (!id || !token) {
      showError('Введите idInstance и ApiTokenInstance');
      return null;
    }
    return { id, token };
  }

  function setLoading(on) {
    const badge = document.getElementById('status-badge');
    const spinner = document.getElementById('spinner');
    if (on) {
      badge.textContent = 'loading...';
      badge.className = 'status-badge loading';
      spinner.style.display = 'inline-block';
    } else {
      spinner.style.display = 'none';
    }
  }

  function showResult(data, method, ms) {
    const badge = document.getElementById('status-badge');
    badge.textContent = '200 OK';
    badge.className = 'status-badge ok';
    document.getElementById('response-meta').textContent = `${method}  ·  ${ms}ms`;
    document.getElementById('response-output').value = JSON.stringify(data, null, 2);
  }

  function showError(msg, method, ms) {
    const badge = document.getElementById('status-badge');
    badge.textContent = 'Error';
    badge.className = 'status-badge err';
    if (method) document.getElementById('response-meta').textContent = `${method}  ·  ${ms ?? '—'}ms`;
    document.getElementById('response-output').value = msg;
  }

  async function callMethod(method) {
    const creds = getCredentials();
    if (!creds) return;
    const { id, token } = creds;
    setLoading(true);
    const t0 = Date.now();

    try {
      let url, options;

      if (method === 'getSettings') {
        url = `${BASE}/waInstance${id}/getSettings/${token}`;
        options = { method: 'GET' };
      }

      else if (method === 'getStateInstance') {
        url = `${BASE}/waInstance${id}/getStateInstance/${token}`;
        options = { method: 'GET' };
      }

      else if (method === 'sendMessage') {
        const phone = document.getElementById('msg-phone').value.trim();
        const text  = document.getElementById('msg-text').value.trim();
        if (!phone || !text) { showError('Введите номер телефона и текст сообщения'); setLoading(false); return; }
        url = `${BASE}/waInstance${id}/sendMessage/${token}`;
        options = {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chatId: `${phone}@c.us`, message: text })
        };
      }

      else if (method === 'sendFileByUrl') {
        const phone   = document.getElementById('file-phone').value.trim();
        const fileUrl = document.getElementById('file-url').value.trim();
        if (!phone || !fileUrl) { showError('Введите номер телефона и URL файла'); setLoading(false); return; }
        const fileName = fileUrl.split('/').pop() || 'file';
        url = `${BASE}/waInstance${id}/sendFileByUrl/${token}`;
        options = {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chatId: `${phone}@c.us`, urlFile: fileUrl, fileName })
        };
      }

      const res  = await fetch(url, options);
      const ms   = Date.now() - t0;
      const data = await res.json();
      setLoading(false);

      if (!res.ok) {
        showError(JSON.stringify(data, null, 2), method, ms);
        document.getElementById('status-badge').textContent = `${res.status} Error`;
      } else {
        showResult(data, method, ms);
      }

    } catch (err) {
      setLoading(false);
      showError(`Ошибка сети: ${err.message}`, method, Date.now() - t0);
    }
  }
</script>

</body>
</html>
